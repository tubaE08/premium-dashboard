<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Verify Number</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
body{background:#f4f7f6;color:#14213d;font-family:Inter,Arial,sans-serif;min-height:100vh}
.header{background:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e6ebe9;position:sticky;top:0;z-index:5}
.logo{font-size:30px;font-weight:800;color:#0e9f4f;letter-spacing:-1px}
.burger{background:none;border:0;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.burger span{display:block;width:28px;height:3px;background:#14213d;border-radius:2px}
.hero{height:150px;background:linear-gradient(180deg,#eaf6ef 0%,#c6e4d1 100%);position:relative;overflow:hidden}
.hero .sun{position:absolute;right:80px;top:18px;width:110px;height:110px;border-radius:50%;background:#fbe21c}
.hero .hill{position:absolute;left:-20%;bottom:-70px;width:140%;height:130px;background:#b5dbc3;border-radius:50% 50% 0 0}
.hero .road{position:absolute;left:0;right:0;bottom:22px;height:14px;background:#555;transform:rotate(-3deg)}
.wrap{padding:0 16px;margin-top:-12px;position:relative}
.card{background:#fff;border-radius:24px;padding:20px 16px 18px;box-shadow:0 6px 24px rgba(20,33,61,.08);max-width:520px;margin:20px auto;scroll-margin-top:80px}
.card h2{margin:0 0 4px;font-size:20px}
.sub{margin:0 0 18px;color:#7b8794;font-size:14px}
.field{border:1.5px solid #d5dbe0;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:14px;transition:border-color .15s}
.field:focus-within{border-color:#0e9f4f}
.field svg{flex:none}
.field label{display:block;color:#0e9f4f;font-size:13px;margin-bottom:2px}
.field input{width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:22px;font-weight:700;color:#14213d;padding:0;margin:0}
.field input::placeholder{color:#a0a9b4}
.btn{width:100%;margin-top:20px;border:0;border-radius:16px;padding:18px;background:#0e9f4f;color:#fff;font-size:18px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}
.btn:active{background:#0b8741}

/* system card */
.sys-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eef1f0;font-size:15px}
.sys-row:last-child{border-bottom:0}
.sys-row span:first-child{color:#7b8794}
.online{color:#0e9f4f;font-weight:700}

/* developer card */
.dev{text-align:center}
.dev p{margin:6px 0;color:#7b8794;font-size:14px}
.socials{display:flex;justify-content:center;gap:14px;margin:16px 0 6px}
.social{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.social.ig{background:linear-gradient(45deg,#f9a03f,#e1306c,#7b3fe4)}
.social.fb{background:#1877f2}
.social.tg{background:#27a7e7}
.handle{font-size:13px;color:#7b8794;margin-top:4px}
.copy{text-align:center;font-size:12px;color:#7b8794;padding:0 20px 34px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:78%;max-width:320px;background:#fff;z-index:21;transform:translateX(100%);transition:transform .22s ease;padding:20px 18px;display:flex;flex-direction:column;padding-top:max(20px,env(safe-area-inset-top))}
.drawer.show{transform:none}
.drawer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.x{background:none;border:0;font-size:30px;line-height:1;cursor:pointer;color:#14213d}
.menu a.item{display:flex;align-items:center;gap:14px;padding:14px 12px;border-radius:14px;color:#14213d;text-decoration:none;font-size:17px;font-weight:600}
.menu a.item:active,.menu a.item:hover{background:#eaf6ef;color:#0e9f4f}
.menu a.item svg{flex:none}
.menu-soc{margin-top:auto;padding-top:16px;border-top:1px solid #eef1f0}
.menu-soc .t{font-size:13px;color:#7b8794;margin:0 0 10px 12px}
.menu-soc .socials{justify-content:flex-start;margin:0 0 10px 12px}
.menu-soc .social{width:46px;height:46px;border-radius:14px}

/* popup */
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:22px;width:100%;max-width:380px;padding:26px 22px 22px;text-align:center;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.icon{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.icon.ok{background:#0e9f4f}
.icon.bad{background:#e5484d}
.modal h3{margin:0 0 6px;font-size:20px}
.modal .num{color:#7b8794;font-size:14px;margin-bottom:14px}
.modal pre{background:#f4f7f6;color:#14213d;text-align:left;padding:14px;border-radius:12px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;margin:0 0 16px}
.modal .btn{margin-top:0;padding:14px;font-size:16px}
</style>
</head>

<!-- Result popup -->
<div class="overlay" id="overlay">
 <div class="modal">
  <div class="icon" id="icon"></div>
  <h3 id="title"></h3>
  <div class="num" id="shownum"></div>
  <pre id="response"></pre>
  <button class="btn" id="close" type="button">OK</button>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);

/* menu */
function menu(open){
 $('drawer').classList.toggle('show',open);
 $('scrim').classList.toggle('show',open);
}
$('open').addEventListener('click',()=>menu(true));
$('close-menu').addEventListener('click',()=>menu(false));
$('scrim').addEventListener('click',()=>menu(false));
document.querySelectorAll('.menu a.item').forEach(a=>a.addEventListener('click',()=>menu(false)));

/* popup */
function showPopup(ok,number,title,body){
 $('icon').className='icon '+(ok?'ok':'bad');
 $('icon').textContent=ok?'✓':'✕';
 $('title').textContent=title;
 $('shownum').textContent=number;
 $('response').textContent=JSON.stringify(body,null,2);
 $('overlay').classList.add('show');
}
$('close').addEventListener('click',()=>$('overlay').classList.remove('show'));
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))$('overlay').classList.remove('show')});

/* verify */
$('form').addEventListener('submit',async e=>{
 e.preventDefault();
 const number=$('number').value.trim();
 if(!/^\+?[0-9]{8,15}$/.test(number)){
  showPopup(false,number,'Invalid phone number',{success:false,message:'Enter 8 to 15 digits'});
  return;
 }

 const btn=$('submit');
 btn.disabled=true;
 btn.textContent='CHECKING...';

 try{
  const r=await fetch('/api/verify?num='+encodeURIComponent(number));
  const data=await r.json();
  const ok=r.ok && data.success===true;
  showPopup(ok,number,ok?'Verification Successful':'Verification Failed',{http_status:r.status,...data});
 }catch(err){
  showPopup(false,number,'Connection Error',{success:false,message:'Connection error'});
 }

 btn.disabled=false;
 btn.textContent='VERIFY';
});
</script>
